services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: encurtador
      MYSQL_USER: encurtador
      MYSQL_PASSWORD: encurtador
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Encurtador.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__MySql: "Server=mysql;Port=3306;Database=encurtador;User=encurtador;Password=encurtador"
      ConnectionStrings__Redis: "redis:6379"
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
