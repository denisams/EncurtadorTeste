services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: encurtador
      MYSQL_USER: encurtador
      MYSQL_PASSWORD: encurtador
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF persistence so the short-code counter (and warm cache) survive a
    # container restart. Without this, a Redis restart would reset the
    # counter to zero while MySQL still has the old rows, and the next
    # auto-generated codes would collide with existing ones.
    command: redis-server --appendonly yes
    ports:
      # Host port 16379 (not the default 6379) to avoid clashing with any other
      # Redis already running on the host. The API container itself talks to
      # this service over the internal Docker network as "redis:6379".
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Encurtador.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__MySql: "Server=mysql;Port=3306;Database=encurtador;User=encurtador;Password=encurtador"
      ConnectionStrings__Redis: "redis:6379"
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
